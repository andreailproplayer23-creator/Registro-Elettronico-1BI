<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - 1BI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    
    <nav class="glass-navbar">
        <div class="nav-logo" style="color: #ef4444;">Registro 1BI - Area Amministratore (Pieni Poteri)</div>
        <div class="nav-user">
            <span id="nomeUtenteDisplay">Caricamento...</span>
            <button id="logoutBtn" class="glass-btn-small">Esci</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="glass-sidebar">
            <button class="tab-btn active" onclick="apriTab('agenda')">📅 Gestione Agenda</button>
            <button class="tab-btn" onclick="apriTab('bacheca')">📌 Gestione Bacheca</button>
        </aside>

        <main class="glass-content">
            <!-- SEZIONE AGENDA -->
            <section id="agenda" class="tab-content active">
                <div class="section-header">
                    <h2>Supervisione Agenda</h2>
                    <!-- NUOVI CONTROLLI CALENDARIO (Mesi e Visualizzazione) -->
                    <div class="calendar-controls" style="display: flex; align-items: center; gap: 15px;">
                        <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                            <button id="prevMonthBtn" class="glass-btn-small" style="padding: 6px 12px;">&lt;</button>
                            <span id="currentMonthDisplay" style="color: #fafafa; font-weight: 600; font-size: 14px; min-width: 130px; text-align: center;">Novembre 2026</span>
                            <button id="nextMonthBtn" class="glass-btn-small" style="padding: 6px 12px;">&gt;</button>
                        </div>
                        <button id="switchViewBtn" class="glass-btn-small">Vista Singola</button>
                        <button id="btnNuovoEvento" class="glass-btn-small active" style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3);">+ NUOVO EVENTO ADMIN</button>
                    </div>
                </div>
                <!-- Griglia Calendario -->
                <div class="calendar-grid" id="calendarGrid"></div>
            </section>

            <!-- SEZIONE BACHECA -->
            <section id="bacheca" class="tab-content" style="display: none;">
                <div class="section-header">
                    <h2>Supervisione Bacheca</h2>
                </div>
                <div class="bacheca-split">
                    <div class="bacheca-col">
                        <h3>Circolari Scuola</h3>
                        <div class="list-container" id="listaCircolari">
                            <p class="info-text" style="text-align:center;">Sincronizzazione o Proxy in blocco...</p>
                        </div>
                    </div>
                    <div class="bacheca-col">
                        <div class="col-header">
                            <h3>Comunicazioni (Tutte)</h3>
                            <button id="btnNuovoAnnuncio" class="glass-btn-small active" style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3);">+ NUOVO ANNUNCIO</button>
                        </div>
                        <div class="list-container" id="listaComunicazioni"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL EVENTO (Sistemato) -->
    <div id="modalEvento" class="glass-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="chiudiModal('modalEvento')">&times;</span>
            <h2>Forza Inserimento Evento</h2>
            <form id="formEvento">
                <!-- Label messa PRIMA dell'input -->
                <div class="input-group">
                    <label for="tipoEvento">Tipologia*</label>
                    <input type="text" id="tipoEvento" placeholder="es. Verifica, Gita, Avviso" required>
                </div>
                <div class="input-group">
                    <label for="dataEvento">Data Evento*</label>
                    <input type="date" id="dataEvento" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="tuttaGiornata">
                    <label for="tuttaGiornata">Tutta la giornata</label>
                </div>
                <div class="time-group" id="timeGroup">
                    <div class="input-group">
                        <label for="oraInizio">Ora Inizio</label>
                        <input type="time" id="oraInizio">
                    </div>
                    <div class="input-group">
                        <label for="oraFine">Ora Fine</label>
                        <input type="time" id="oraFine">
                    </div>
                </div>
                <div class="input-group">
                    <label for="descrizioneEvento">Descrizione</label>
                    <textarea id="descrizioneEvento" rows="3" placeholder="Dettagli dell'evento..."></textarea>
                </div>
                <div class="file-group">
                    <label>Allegati (Max 1GB)</label>
                    <input type="file" id="fileEvento" multiple>
                </div>
                <button type="submit" class="glass-btn" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);">Salva come Admin</button>
            </form>
        </div>
    </div>

    <!-- MODAL ANNUNCIO (Sistemato) -->
    <div id="modalAnnuncio" class="glass-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="chiudiModal('modalAnnuncio')">&times;</span>
            <h2>Forza Comunicazione</h2>
            <form id="formAnnuncio">
                <!-- Label messa PRIMA dell'input -->
                <div class="input-group">
                    <label for="titoloAnnuncio">Titolo*</label>
                    <input type="text" id="titoloAnnuncio" placeholder="es. Chiusura straordinaria" required>
                </div>
                <div class="input-group">
                    <label for="descrizioneAnnuncio">Descrizione</label>
                    <textarea id="descrizioneAnnuncio" rows="4" placeholder="Testo della comunicazione..."></textarea>
                </div>
                <div class="file-group">
                    <label>Allegato</label>
                    <input type="file" id="fileAnnuncio">
                </div>
                <button type="submit" class="glass-btn" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);">Pubblica come Admin</button>
            </form>
        </div>
    </div>

    <!-- MODAL VISUALIZZA/ELIMINA -->
    <div id="modalVisualizzaEvento" class="glass-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="chiudiModal('modalVisualizzaEvento')">&times;</span>
            <h2 id="viewTipoEvento" style="color:#ef4444;">Dettaglio (Modo Admin)</h2>
            <div style="color: #e4e4e7;">
                <p class="autore-data">AUTORE: <span id="viewAutore"></span></p>
                <p class="autore-data">DATA: <span id="viewDataOrario"></span></p>
                <div id="viewDescrizione" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.05); min-height: 60px;"></div>
                <div id="viewAllegatiContainer" class="hidden">
                    <div id="viewAllegatiList" class="allegati-list"></div>
                </div>
                <button id="btnEliminaEvento" class="glass-btn" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); margin-top: 20px; box-shadow: none;">Forza Eliminazione Evento</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>
    
    <script src="admin.js"></script>
</body>
</html>
