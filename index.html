<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Registro Elettronico 1BI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-box">
        <div class="login-header">
            <h2>Registro Elettronico</h2>
            <p>1BI - Accesso Utenti</p>
        </div>

        <form id="loginForm">
            <!-- CAMPO EMAIL -->
            <div class="input-group">
                <label for="email">Indirizzo Email</label>
                <input type="email" id="email" placeholder="es. mario.rossi@scuola.it" required>
            </div>
            
            <!-- CAMPO PASSWORD -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div id="errorMessage" class="error-message"></div>
            
            <button type="submit" id="loginBtn" class="glass-btn">Accedi al Registro</button>
            
            <!-- CORRETTO: id cambiato in "loader" -->
            <div id="loader" class="loader hidden"></div>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <!-- CORRETTO: collegato a login.js invece di auth.js -->
    <script src="login.js"></script>
</body>
</html>
